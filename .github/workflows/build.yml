name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish the APK as a release on main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: image-studio-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      # Every build of main becomes a release with a phone-friendly download link.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ImageStudio.apk
          gh release create "build-${{ github.run_number }}" ImageStudio.apk \
            --title "Image Studio build ${{ github.run_number }}" \
            --notes "Install ImageStudio.apk on your phone. Built from ${{ github.sha }}." \
            --latest
